[package]
name = "iusage-mac-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tinyjson = "=2.5.1"

# Allows offline verification of the shared Rust core on the Windows development host.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_Storage_FileSystem"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
